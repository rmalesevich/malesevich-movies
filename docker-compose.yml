# Development stack for the MacBook: code is bind-mounted and uvicorn reloads.
#   docker compose up --build
services:
  web:
    build: .
    image: malesevich-movies:dev
    container_name: malesevich-movies-dev
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DEBUG: "true"
      DATABASE_URL: "sqlite:////app/data/malesevich.db"
    volumes:
      # Live code reload.
      - ./app:/app/app
      - ./alembic:/app/alembic
      - ./alembic.ini:/app/alembic.ini
      # The database and any seed CSVs, kept on the host so they survive a rebuild.
      - ./data:/app/data
    command: >
      uvicorn app.main:app
      --host 0.0.0.0 --port 8000
      --workers 1 --reload
      --reload-dir /app/app
    restart: unless-stopped
