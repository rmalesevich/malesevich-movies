# Runtime definition for the TrueNAS Custom App.
#
# This file deliberately contains NO `build:` section. TrueNAS runs a
# `docker compose pull` when it deploys or updates an app, and a pull against a
# locally-built image fails ("pull access denied"). So the image is built by
# hand over SSH (see README, "Deploying to TrueNAS") and this file only ever
# runs the image that already exists on the box.
#
# TrueNAS Apps -> Custom App -> Install via YAML:
#
#   include:
#     - /mnt/SSDPool/Application_Data/Malesevich-Movies/docker-compose.prod.yml
#   services: {}
#
# Paths, ports and the uid/gid come from the .env file sitting next to this one.
services:
  web:
    image: malesevich-movies:latest
    # Never reach out to a registry: this image only exists locally.
    pull_policy: never
    container_name: malesevich-movies
    ports:
      - "${HOST_PORT:-8080}:8000"
    env_file:
      - .env
    environment:
      DEBUG: "false"
      DATABASE_URL: "sqlite:////app/data/malesevich.db"
    volumes:
      - ${DATA_PATH:?set DATA_PATH in .env}:/app/data
    restart: unless-stopped
    # Must own DATA_PATH. On TrueNAS this is usually apps:apps (568:568).
    user: "${PUID:-568}:${PGID:-568}"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
